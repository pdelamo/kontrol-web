# ⚠️ ESTE FICHERO VIVE FUERA DE `web/` A PROPÓSITO: la carpeta que se publica solo tiene lo que se publica
# (si estuviera dentro, cualquiera podría leer la configuración en /nginx-web.conf).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/html text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  # La página cambia cuando la cambiamos: el navegador pregunta antes de darla por buena, así cada
  # versión nueva se ve al recargar. `always` para que salga también en los 304.
  add_header Cache-Control "no-cache" always;

  autoindex off;
  server_tokens off;

  location / {
    try_files $uri $uri/ =404;
  }

  # Imágenes, vídeo y letra pesan y cambian poco: una hora de caché. Poco a propósito mientras la
  # web se está haciendo (si una foto cambia de contenido sin cambiar de nombre, se ve en una hora).
  # ⚠️ `add_header` no se hereda cuando la location declara el suyo: aquí se sustituye entero.
  location ~* \.(webp|png|jpg|jpeg|svg|mp4|woff2)$ {
    add_header Cache-Control "public, max-age=3600" always;
  }
}
